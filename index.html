<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#edf1e8">
  <title>题匠 · 首页</title>
  <link rel="icon" type="image/png" href="/assets/tijiang-icon.png">
  <style>
    :root {
      color-scheme: light;
      --paper: #fbfaf5;
      --ink: #202c24;
      --muted: #707a6e;
      --line: #d9dfd4;
      --green: #285a43;
      --green-soft: #dce9dc;
      --orange: #d8774c;
      --sun: #edc65e;
      --serif: "Iowan Old Style", "Baskerville", "Songti SC", "STSong", serif;
      --sans: "Avenir Next", "PingFang SC", "Hiragino Sans GB", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background-color: #edf1e8;
      background-image: linear-gradient(rgba(40, 90, 67, .035) 1px, transparent 1px), linear-gradient(90deg, rgba(40, 90, 67, .035) 1px, transparent 1px);
      background-size: 24px 24px;
      font-family: var(--sans);
    }
    button, select, input { font: inherit; }
    button { cursor: pointer; }
    .shell { width: min(1180px, calc(100% - 40px)); margin: 0 auto; }
    .topbar { display: flex; justify-content: space-between; align-items: center; min-height: 80px; border-bottom: 1px solid rgba(32,44,36,.15); }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 700; letter-spacing: .04em; }
    .brand-mark { display: grid; place-items: center; width: 34px; height: 34px; background: var(--green); color: white; border-radius: 50% 50% 50% 4px; font-family: var(--serif); font-size: 18px; }
    .today-label { color: var(--muted); font-size: 13px; }
    main { padding: 45px 0 72px; }
    .intro { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 30px; animation: arrive .45s ease-out both; }
    .eyebrow { margin: 0 0 8px; color: var(--orange); font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; font: 500 clamp(34px, 5vw, 54px)/1.08 var(--serif); letter-spacing: 0; }
    .intro-copy { max-width: 330px; margin: 0 0 4px; color: var(--muted); font-size: 14px; line-height: 1.7; }
    .layout { display: block; }
    .toolbar { display: flex; justify-content: flex-end; gap: 8px; max-width: 900px; margin: 0 auto 14px; }
    .toolbar-button { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 13px; color: var(--green); background: var(--paper); border: 1px solid var(--line); border-radius: 3px; font-size: 13px; font-weight: 700; }
    .toolbar-button:hover { background: var(--green-soft); }
    .settings { padding: 23px 22px; background: rgba(251,250,245,.72); border-top: 3px solid var(--green); animation: arrive .5s .06s ease-out both; }
    .section-head { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
    h2 { margin: 0; font: 600 18px/1.3 var(--serif); }
    .section-head span { color: var(--muted); font-size: 11px; }
    .field { display: block; margin-top: 20px; }
    .field-label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; color: #59645a; font-size: 12px; font-weight: 700; }
    select, input[type="number"], input[type="time"] { width: 100%; min-height: 42px; padding: 0 11px; color: var(--ink); background: white; border: 1px solid var(--line); border-radius: 3px; outline-color: var(--green); }
    .checkbox-row { display: flex; gap: 9px; align-items: center; margin-top: 20px; font-size: 13px; }
    .checkbox-row input { accent-color: var(--green); width: 16px; height: 16px; }
    .actions { display: grid; gap: 9px; margin-top: 23px; }
    .button { display: inline-flex; justify-content: center; align-items: center; gap: 9px; min-height: 43px; padding: 0 14px; border: 1px solid var(--green); border-radius: 3px; font-size: 13px; font-weight: 700; transition: transform .16s ease, background .16s ease; }
    .button:hover { transform: translateY(-1px); }
    .button-primary { color: white; background: var(--green); }
    .button-primary:hover { background: #1d4935; }
    .button-light { color: var(--green); background: transparent; }
    .button-light:hover { background: var(--green-soft); }
    .status { min-height: 18px; margin: 12px 0 0; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .sheet { position: relative; overflow: hidden; max-width: 900px; margin: 0 auto; padding: 35px clamp(22px, 5vw, 58px) 42px; background: var(--paper); border: 1px solid rgba(32,44,36,.12); box-shadow: 0 18px 50px rgba(35,53,39,.09); animation: arrive .55s .12s ease-out both; }
    .sheet::before { position: absolute; top: 0; left: 0; width: 8px; height: 100%; content: ""; background: var(--sun); }
    .sheet-meta { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 12px; }
    .sheet-title { margin: 24px 0 6px; text-align: center; font: 600 29px/1.25 var(--serif); }
    .sheet-subtitle { margin: 0 0 25px; color: var(--muted); text-align: center; font-size: 12px; }
    .student-line { display: flex; gap: 24px; margin: 0 0 29px; padding: 12px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); color: #525c53; font-size: 12px; }
    .student-line span { flex: 1; }
    .student-line span:last-child { flex: 1.5; }
    .question-section { margin-top: 25px; }
    .question-section h3 { display: flex; align-items: center; gap: 10px; margin: 0 0 14px; font: 600 16px/1.3 var(--serif); }
    .question-section h3::after { height: 1px; flex: 1; content: ""; background: var(--line); }
    .questions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 26px; row-gap: 14px; }
    .question { display: flex; gap: 9px; align-items: baseline; min-width: 0; font: 15px/1.65 var(--serif); }
    .question-number { flex: 0 0 22px; color: var(--orange); font: 700 11px/1.8 var(--sans); }
    .question-text { overflow-wrap: anywhere; }
    .answers { display: none; margin-top: 28px; padding: 18px 18px 20px; background: #eef3e9; border-left: 3px solid var(--green); }
    .answers.visible { display: block; }
    .answers h3 { margin: 0 0 12px; font: 600 15px var(--serif); }
    .answers-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px 14px; color: #435348; font-size: 12px; }
    .sheet-footer { display: flex; justify-content: space-between; margin-top: 35px; padding-top: 13px; border-top: 1px dashed var(--line); color: #879087; font-size: 10px; }
    .empty { padding: 52px 20px; color: var(--muted); text-align: center; }
    @keyframes arrive { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 760px) {
      .shell { width: min(100% - 24px, 560px); }
      .topbar { min-height: 66px; }
      main { padding-top: 30px; }
      .intro { display: block; margin-bottom: 22px; }
      .intro-copy { margin-top: 12px; }
      .toolbar { justify-content: flex-start; }
      .toolbar-button { flex: 1; justify-content: center; padding: 0 8px; }
      .sheet { padding: 28px 20px 32px 25px; }
      .sheet-title { font-size: 25px; }
      .questions { grid-template-columns: 1fr; }
      .answers-grid { grid-template-columns: repeat(3, 1fr); }
      .student-line { gap: 10px; }
    }
    @media print {
      @page { size: A4 portrait; margin: 7mm; }
      body { background: white; }
      .topbar, .intro, .toolbar, .sheet-meta .screen-only { display: none !important; }
      .shell { width: 100%; max-width: none; }
      main { padding: 0; }
      .layout { display: block; }
      .sheet { width: 100%; max-width: none; margin: 0; padding: 0; overflow: visible; border: 0; box-shadow: none; animation: none; }
      .sheet::before { display: none; }
      .sheet-title { margin: 0 0 2mm; font-size: 16pt; }
      .sheet-subtitle { margin: 0 0 3mm; font-size: 8pt; }
      .student-line { margin-bottom: 3mm; padding: 2mm 0; font-size: 8pt; }
      .question-section { margin-top: 3mm; break-inside: avoid; }
      .question-section h3 { margin-bottom: 1.5mm; font-size: 10pt; }
      .questions { grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: 3mm; row-gap: 1.5mm; }
      .question { gap: 1mm; font-size: 9pt; line-height: 1.8; white-space: nowrap; }
      .question-number { flex-basis: 17px; font-size: 8pt; }
      .sheet-footer { margin-top: 3mm; padding-top: 2mm; }
    }
    .home-page { min-height: 100vh; }
    .home-shell { display: flex; flex-direction: column; width: min(860px, calc(100% - 40px)); min-height: 100vh; margin: 0 auto; padding: 38px 0; }
    .home-brand { display: inline-flex; align-items: center; gap: 12px; width: fit-content; color: var(--ink); font-size: 14px; font-weight: 700; text-decoration: none; }
    .home-logo { object-fit: cover; }
    .home-content { max-width: 600px; margin: auto 0; padding: 54px 0 90px; }
    .home-content .eyebrow { letter-spacing: 0; }
    .home-content h1 { margin: 0 0 18px; font: 500 50px/1.16 var(--serif); }
    .home-description { max-width: 440px; margin: 0 0 28px; color: var(--muted); font-size: 15px; line-height: 1.8; }
    .home-link { display: inline-flex; align-items: center; justify-content: space-between; gap: 34px; min-width: 190px; padding: 14px 16px; color: white; background: var(--green); border-radius: 3px; font-size: 14px; font-weight: 700; text-decoration: none; }
    .home-link:hover { background: #1d4935; }
    .home-link span { font-size: 18px; }
    @media (max-width: 760px) {
      .home-shell { width: min(100% - 40px, 560px); padding: 26px 0; }
      .home-content h1 { font-size: 38px; }
    }
  </style>
</head>
<body class="home-page">
  <main class="home-shell">
    <a class="home-brand" href="/" aria-label="题匠首页"><img class="brand-mark home-logo" src="/assets/tijiang-icon.png" alt=""><span>题匠</span></a>
    <section class="home-content">
      <p class="eyebrow">DAILY MATH PRACTICE</p>
      <h1>今天的练习，<br>从这里开始。</h1>
      <p class="home-description">每天一套小学数学练习，包含乘法与 20 以内加减法。</p>
      <a class="home-link" href="/worksheet.html">今日份试卷(三上) <span aria-hidden="true">→</span></a>
    </section>
  </main>
</body>
</html>
